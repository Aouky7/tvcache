name: materialize
on:
  push:
    branches: [main]
    paths:
      - 'Spiders.jar.b64'
      - '.github/workflows/materialize.yml'
  workflow_dispatch: {}
jobs:
  jar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: decode
        run: |
          base64 -d Spiders.jar.b64 > Spiders.jar
          ls -l Spiders.jar
          sha256sum Spiders.jar
      - name: commit
        run: |
          git config user.name "tvcache-bot"
          git config user.email "bot@users.noreply.github.com"
          git add Spiders.jar
          git commit -m "materialize Spiders.jar" || echo no-change
          git push
